name: CI

on:
  push:
    branches: ['master', 'feature/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Temporary diagnostic for the existing failed Sonar check; remove after retrieval.
      - name: Read previous Sonar annotations
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/mermaid-enhanced-rendering-20261125'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate repos/yohi/markview/check-runs/138914682180/annotations --jq '.[] | {path, start_line, end_line, annotation_level, title, message}'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:browser
      - name: Upload browser evidence and resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markview-browser-evidence
          path: |
            test-results/
            package-lock.json
          if-no-files-found: ignore
