name: Deploy Cloudflare

# Available only from the default branch. A completed CI run is not
# sufficient by itself: the job must also pass the trusted push/branch checks.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: markview-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'master' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout CI-verified revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Skip superseded CI results
        id: latest
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          master_sha="$(git ls-remote --exit-code origin refs/heads/master | cut -f1)"
          if [[ "$master_sha" != "$VERIFIED_SHA" ]]; then
            echo "::notice::CI revision is no longer master HEAD; skipping deployment"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify deployment credentials are configured
        if: steps.latest.outputs.should_deploy == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Configure CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable before deploying"
            exit 1
          fi

      - name: Set up Node.js
        if: steps.latest.outputs.should_deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The repository does not yet contain package-lock.json; use npm install
      # consistently with CI until a lockfile is added.
      - name: Install dependencies
        if: steps.latest.outputs.should_deploy == 'true'
        run: npm install --no-audit --no-fund

      - name: Build static assets
        if: steps.latest.outputs.should_deploy == 'true'
        run: npm run build

      - name: Deploy Workers Static Assets
        if: steps.latest.outputs.should_deploy == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
